<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅客旅程学习模拟器 · OPC Studio</title>
<meta name="description" content="以旅客第一人称走完从公共交通到落座的全流程，同屏看见每一步背后的机场与航司系统链路（AODB / DCS / BHS / A-CDM）与所属管理域。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0a07'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="ui/style.css?v=0.12">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "./main.js": "./main.js?v=0.12",
    "./data/build-info.js": "./data/build-info.js?v=0.12",
    "./data/domains.js": "./data/domains.js?v=0.12",
    "./data/glossary.js": "./data/glossary.js?v=0.12",
    "./data/i18n.js": "./data/i18n.js?v=0.12",
    "./data/ict.js": "./data/ict.js?v=0.12",
    "./data/landscape.js": "./data/landscape.js?v=0.12",
    "./data/messages.js": "./data/messages.js?v=0.12",
    "./data/steps.js": "./data/steps.js?v=0.12",
    "./data/systems-more.js": "./data/systems-more.js?v=0.12",
    "./data/systems.js": "./data/systems.js?v=0.12",
    "./engine/flow-engine.js": "./engine/flow-engine.js?v=0.12",
    "./engine/state.js": "./engine/state.js?v=0.12",
    "./scene/actors.js": "./scene/actors.js?v=0.12",
    "./scene/director.js": "./scene/director.js?v=0.12",
    "./scene/labels.js": "./scene/labels.js?v=0.12",
    "./scene/props.js": "./scene/props.js?v=0.12",
    "./scene/renderer.js": "./scene/renderer.js?v=0.12",
    "./scene/tween.js": "./scene/tween.js?v=0.12",
    "./scene/world.js": "./scene/world.js?v=0.12",
    "./ui/ctrl-dock.js": "./ui/ctrl-dock.js?v=0.12",
    "./ui/defaults-window.js": "./ui/defaults-window.js?v=0.12",
    "./ui/domain-map.js": "./ui/domain-map.js?v=0.12",
    "./ui/flow-bar.js": "./ui/flow-bar.js?v=0.12",
    "./ui/health.js": "./ui/health.js?v=0.12",
    "./ui/info-window.js": "./ui/info-window.js?v=0.12",
    "./ui/journey-rail.js": "./ui/journey-rail.js?v=0.12",
    "./ui/landscape-window.js": "./ui/landscape-window.js?v=0.12",
    "./ui/narrative.js": "./ui/narrative.js?v=0.12",
    "./ui/term-link.js": "./ui/term-link.js?v=0.12",
    "./ui/window-manager.js": "./ui/window-manager.js?v=0.12"
  }
}
</script>
</head>
<body>

<!-- ── 顶栏：导航 + 全局开关 + 窗口 dock ─────────────────────── -->
<header>
  <a class="navlink" href="https://opcstudio.cc/" data-i18n="back">← 返回主页</a>
  <a class="navlink" href="https://opcstudio.cc/pax-journey/downloads/" data-i18n="btnDesktop" target="_blank" rel="noopener">💾 桌面版</a>
  <div class="brand">
    <h1 data-i18n="title">旅客旅程学习模拟器</h1>
    <span class="sub" data-i18n="subtitle">从公共交通到落座 · 看得见的世界 × 看不见的系统</span>
  </div>
  <div class="spacer"></div>
  <div class="dock" id="dock">
    <button class="tgl dock-btn" data-win="rail"      data-i18n="railTitle">旅客旅程</button>
    <button class="tgl dock-btn" data-win="narrative" data-i18n="narrTitle">本步解说</button>
    <button class="tgl dock-btn" data-win="branches"  data-i18n="branchWinTitle">路径选择</button>
    <button class="tgl dock-btn" data-win="flowbar"   data-i18n="flowTitle">系统与报文链路</button>
    <button class="tgl dock-btn" data-win="domains"   data-i18n="domainTitle">机场管理域</button>
    <button class="tgl dock-btn" data-win="landscape" data-i18n="landscapeTitle">管理节点全景</button>
    <button class="tgl dock-btn" data-win="defaults"  data-i18n="btnDefaults">默认路径</button>
    <button class="tgl" id="btn-layout" data-i18n="btnLayout">复位布局</button>
  </div>
  <div class="sep"></div>
  <button class="tgl" id="tgl-intl">国内航班</button>
  <button class="tgl" id="tgl-oneid">传统证件核验</button>
  <button class="tgl" id="tgl-view">旅客视角</button>
  <button id="lang-btn">EN</button>
</header>

<!-- ── 3D 视口（全屏底图）───────────────────────────────────── -->
<main class="viewport" id="viewport">
  <div class="vp-tip" data-i18n="tipDrag">拖动旋转 · 滚轮缩放</div>
  <div class="legend" id="legend"></div>
  <div class="build-badge" id="build-badge" title=""></div>
</main>

<!-- ── 浮窗：旅客旅程 ───────────────────────────────────────── -->
<aside class="panel" id="rail">
  <div class="panel-head"><h2 data-i18n="railTitle">旅客旅程</h2></div>
  <div class="panel-body"></div>
  <div class="stat-row"></div>
</aside>

<!-- ── 浮窗：本步解说 ───────────────────────────────────────── -->
<section class="panel narrative" id="narrative">
  <div class="panel-head"><h2 data-i18n="narrTitle">本步解说</h2></div>
  <div class="panel-body nv-body"></div>
</section>

<!-- ── 浮窗：路径选择（分支）────────────────────────────────── -->
<section class="panel branches" id="branches">
  <div class="panel-head"><h2 data-i18n="branchWinTitle">路径选择</h2></div>
  <div class="panel-body bc-body"></div>
</section>

<!-- ── 浮窗：系统与报文链路 ─────────────────────────────────── -->
<section class="panel flowbar" id="flowbar">
  <div class="panel-head"><h2 data-i18n="flowTitle">系统与报文链路</h2></div>
  <div class="panel-body">
    <div class="fb-hint" data-i18n="flowHint">点击节点或报文查看知识卡</div>
    <div class="fb-scroll"><div class="fb-canvas"></div></div>
    <div class="fb-ms"></div>
  </div>
</section>

<!-- ── 浮窗：机场管理域 ─────────────────────────────────────── -->
<aside class="panel" id="domains">
  <div class="panel-head"><h2 data-i18n="domainTitle">机场管理域</h2></div>
  <div class="panel-body">
    <div class="panel-hint" data-i18n="domainHint">当前步骤所属域高亮；点击任意域查看其职责、系统与 KPI</div>
    <div class="dom-list"></div>
  </div>
</aside>

<!-- ── 浮窗：管理节点全景（旅客旅程之外的全部节点）──────────── -->
<aside class="panel" id="landscape">
  <div class="panel-head"><h2 data-i18n="landscapeTitle">管理节点全景</h2></div>
  <div class="panel-body ls-body"></div>
</aside>

<!-- ── 浮窗：默认路径配置 ───────────────────────────────────── -->
<aside class="panel" id="defaults">
  <div class="panel-head"><h2 data-i18n="defaultsTitle">默认路径配置</h2></div>
  <div class="panel-body df-body"></div>
</aside>

<!-- ── 控制台悬浮球：可拖动，单击展开/收起流程控制条 ─────────── -->
<div class="ctrl-dock" id="ctrl-dock">
  <div class="ctrl-menu" id="ctrl-menu">
    <button class="btn" id="btn-restart" data-i18n="btnRestart">重新开始</button>
    <button class="btn" id="btn-auto" data-i18n="btnAuto">自动播放</button>
    <button class="btn" id="btn-replay" data-i18n="btnReplay">重播本步</button>
    <button class="btn" id="btn-prev" data-i18n="btnPrev">◀ 上一步</button>
    <button class="btn primary" id="btn-next" data-i18n="btnNext">下一步 ▶</button>
  </div>
  <button class="fab" id="ctrl-fab" aria-expanded="false" aria-label="next / controls">▶</button>
</div>

<!-- 加载看门狗：main.js 若因网络/文件缺失没能启动，8 秒后给出可读提示而不是白屏 -->
<script>
  window.__paxLoadWatchdog = setTimeout(function () {
    if (window.__pax) return;
    import('./ui/health.js?v=0.10')
      .then(function (h) {
        h.fatal({
          title: document.documentElement.lang === 'en' ? 'Failed to load resources' : '资源加载失败',
          detail: document.documentElement.lang === 'en'
            ? 'Page scripts did not finish loading within 8 seconds.'
            : '页面脚本在 8 秒内没有完成加载，通常是网络被拦截或文件缺失。',
          hints: [],
        });
      })
      .catch(function () {
        document.body.insertAdjacentHTML('beforeend',
          '<div style="position:fixed;inset:0;background:#0d0a07;color:#e8e3dc;display:grid;place-items:center;' +
          'font-family:system-ui,sans-serif;text-align:center;padding:24px;z-index:9999">' +
          '<div><div style="font-size:40px">⚠️</div><h1 style="color:#e8b86d">资源加载失败 / Failed to load</h1>' +
          '<p>请检查网络后刷新，或下载离线桌面版。<br>Check your network and reload, or use the offline desktop app.</p>' +
          '<p><a style="color:#c9944a" href="https://opcstudio.cc/pax-journey/downloads/">opcstudio.cc/pax-journey/downloads/</a></p>' +
          '</div></div>');
      });
  }, 8000);
</script>
<script type="module" src="main.js?v=0.12"></script>
</body>
</html>
